{{- if .Values.networkPolicy.enabled }}
{{/*
Default-deny ingress, then allow only what is needed.

The core service runs user-supplied code. If that code is ever able to reach
the network, it should not be able to reach the cluster's other tenants or the
Kubernetes API. A default-deny policy is cheap and is the difference between a
contained incident and a lateral movement.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weber.fullname" . }}-default-deny
  labels:
    {{- include "weber.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weber.fullname" . }}-allow-gateway
  labels:
    {{- include "weber.labels" . | nindent 4 }}
spec:
  # Only the gateway may reach the core: it is the single audited entry point.
  podSelector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "weber.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: {{ .Values.core.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weber.fullname" . }}-allow-ingress-controller
  labels:
    {{- include "weber.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes:
    - Ingress
  ingress:
    # From anywhere in the cluster, because the ingress controller's namespace
    # varies. The gateway itself holds no secrets and runs no user code.
    - ports:
        - protocol: TCP
          port: 8080
---
{{/*
Egress policy for the core.

The core runs user-supplied code, so what it may *initiate* matters more than
what may reach it: an ingress-only policy stops nothing the pod starts, which
is precisely the SSRF case. Blocking the cloud metadata endpoint is adopted
from ml-hub, where a pod that can reach 169.254.169.254 may be able to read
the node's instance credentials and escalate beyond the cluster entirely.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weber.fullname" . }}-core-egress
  labels:
    {{- include "weber.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  policyTypes:
    - Egress
  egress:
    # DNS, or nothing resolves and the pod looks broken rather than restricted.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The outside world, minus the metadata endpoint.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- if .Values.networkPolicy.cloudMetadata.enabled }}
            except:
              - {{ .Values.networkPolicy.cloudMetadata.ip }}/32
            {{- end }}
    {{- with .Values.networkPolicy.coreEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
