{{- if .Values.judge0.enabled }}
{{/*
Judge0 runs untrusted snippets. Exposing it only through the gateway matters:
it is the component most likely to be attacked, and it should never be
reachable directly from the network.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weber.fullname" . }}-judge0
  labels:
    {{- include "weber.labels" . | nindent 4 }}
    app.kubernetes.io/component: judge0
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: judge0
  template:
    metadata:
      labels:
        {{- include "weber.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: judge0
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: judge0
          image: "{{ .Values.judge0.image.repository }}:{{ .Values.judge0.image.tag }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.judge0.service.port }}
          env:
            {{- if .Values.judge0.postgres.host }}
            - name: POSTGRES_HOST
              value: {{ .Values.judge0.postgres.host | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.judge0.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.judge0.postgres.username | quote }}
            {{- end }}
            {{- if .Values.judge0.redis.host }}
            - name: REDIS_HOST
              value: {{ .Values.judge0.redis.host | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /system/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /system/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            {{- toYaml .Values.judge0.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weber.fullname" . }}-judge0
  labels:
    {{- include "weber.labels" . | nindent 4 }}
    app.kubernetes.io/component: judge0
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.judge0.service.port }}
      targetPort: http
  selector:
    {{- include "weber.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: judge0
{{- end }}
