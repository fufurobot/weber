{{- if .Values.core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weber.core.fullname" . }}
  labels:
    {{- include "weber.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  replicas: {{ .Values.core.replicaCount }}
  selector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: core
  strategy:
    # The workspace volume is ReadWriteOnce, so two pods cannot run at once.
    # Recreate makes that explicit instead of producing a stuck rollout.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "weber.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: core
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: core
          image: {{ include "weber.core.image" . }}
          imagePullPolicy: {{ .Values.core.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.core.service.port }}
              protocol: TCP
          env:
            - name: CORE_HOST
              value: "0.0.0.0"
            - name: CORE_PORT
              value: {{ .Values.core.service.port | quote }}
            - name: WORKSPACE_ROOT
              value: /workspaces
            - name: WEBER_SEED
              value: {{ .Values.core.seed | quote }}
            - name: WEBER_VERSION
              value: {{ .Chart.AppVersion | quote }}
            {{- if .Values.auth.enabled }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.auth.githubClientId | quote }}
            - name: WEBER_ALLOWED_LOGINS
              value: {{ .Values.auth.allowedLogins | quote }}
            - name: WEBER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "weber.auth.secretName" . }}
                  key: session-secret
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspaces
          {{- if .Values.core.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "weber.core.fullname" . }}-workspaces
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
