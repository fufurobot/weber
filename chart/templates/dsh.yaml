{{- if .Values.dsh.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weber.fullname" . }}-dsh
  labels:
    {{- include "weber.labels" . | nindent 4 }}
    app.kubernetes.io/component: dsh
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "weber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dsh
  template:
    metadata:
      labels:
        {{- include "weber.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dsh
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dsh
          image: "{{ .Values.dsh.image.repository }}:{{ .Values.dsh.image.tag }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.dsh.service.port }}
          env:
            {{- if .Values.dsh.existingSecret }}
            - name: DSH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dsh.existingSecret }}
                  key: api-key
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.dsh.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weber.fullname" . }}-dsh
  labels:
    {{- include "weber.labels" . | nindent 4 }}
    app.kubernetes.io/component: dsh
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.dsh.service.port }}
      targetPort: http
  selector:
    {{- include "weber.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dsh
{{- end }}
