{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{/*
A generated session secret is convenient but has a sharp edge: `helm upgrade`
regenerates it unless the value is pinned or an existing secret is supplied,
which silently invalidates every active session. Operators should set
auth.existingSecret in production.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weber.auth.secretName" . }}
  labels:
    {{- include "weber.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  session-secret: {{ .Values.auth.sessionSecret | default (randAlphaNum 43) | b64enc | quote }}
{{- end }}
