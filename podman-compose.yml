# Weber — portable IDE, composed.
#
#   web   : nginx edge. Serves the SPA and reverse-proxies /api + /ws. The ONLY
#           service that publishes a host port.
#   core  : Bun backend. Files, exec, LSP proxy and the reactive notebook engine.
#           Reached exclusively through the edge on the internal network.
#
# Usage:
#   podman-compose up --build
#   podman-compose down -v
#
# Everything is configurable through compose/.env (see compose/.env.example).

services:
  core:
    build:
      context: ..
      dockerfile: compose/Dockerfile.core
    image: weber-core:latest
    container_name: weber-core
    restart: unless-stopped
    # No `ports:` on purpose — the core is never exposed to the host.
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      CORE_HOST: 0.0.0.0
      CORE_PORT: "8787"
      WORKSPACE_ROOT: /workspaces
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      # Set to 1 to let the notebook engine run untrusted cells in a sandbox.
      WEBER_SANDBOX: "0"
    volumes:
      - weber-workspaces:/workspaces
      - ./..:/opt/weber:ro
    networks:
      - weber-net
    healthcheck:
      test: ["CMD", "bun", "-e", "await fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: compose/Dockerfile.web
    image: weber-web:latest
    container_name: weber-web
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:8080"
    networks:
      - weber-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

networks:
  weber-net:
    driver: bridge

volumes:
  weber-workspaces:
