name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + policy tests (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      # Blocking, not advisory. It was `continue-on-error` while the types were
      # still settling, and in that time it caught a real unreachable branch in
      # the Python kernel that every test passed over. A check that cannot fail
      # the build is not a check.
      - name: Typecheck
        run: bun run typecheck

      - name: Unit and policy tests
        run: bun test

      - name: Validate CI and compose configuration
        run: bun run validate:config

      # The frontend must actually bundle, and the shell must reference the
      # hashed assets the bundler emits.
      - name: Build the frontend
        run: bun run build:web

      - name: Assert the build output is complete
        run: |
          test -f dist/web/index.html || { echo "missing index.html"; exit 1; }
          ls dist/web/assets/*.js >/dev/null || { echo "missing js asset"; exit 1; }
          ls dist/web/assets/*.css >/dev/null || { echo "missing css asset"; exit 1; }
          grep -q 'assets/.*\.js' dist/web/index.html || { echo "shell not rewritten"; exit 1; }
          grep -q 'assets/.*\.css' dist/web/index.html || { echo "css not rewritten"; exit 1; }
          echo "frontend build output OK"

  # Runs the server the way a PaaS does: one process, no nginx, the platform's
  # PORT. Reading the Dockerfile proves nothing about whether the deployment
  # works, and the failure mode here is a request timeout with no log entry.
  combined:
    name: Combined-mode deployment works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build the SPA
        run: bun run build:web

      - name: Start with the platform PORT and probe it
        run: |
          set -euo pipefail
          PORT=18080 CORE_HOST=0.0.0.0 \
            WEBER_WEB_ROOT="$PWD/dist/web" \
            WORKSPACE_ROOT="$(mktemp -d)" \
            WEBER_SEED=1 \
            bun run src/server/main.ts > /tmp/combined.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 6

          B=http://127.0.0.1:18080
          fail() { echo "FAIL: $1"; cat /tmp/combined.log; exit 1; }

          curl -sf -m 10 "$B/api/health" >/dev/null || fail "health unreachable on PORT"
          echo "ok: PORT honoured"

          CT=$(curl -s -o /dev/null -w '%{content_type}' -m 10 "$B/")
          case "$CT" in text/html*) echo "ok: core serves the SPA" ;;
            *) fail "GET / returned $CT, expected HTML" ;; esac

          ASSET=$(curl -s -m 10 "$B/" | grep -o 'assets/[^"]*\.js' | head -1)
          curl -sf -m 10 "$B/$ASSET" >/dev/null || fail "asset $ASSET not served"
          echo "ok: hashed asset served"

          curl -s -m 10 "$B/api/fs/list?path=" | grep -q README.md \
            || fail "workspace was not seeded"
          echo "ok: workspace seeded"

      - name: Auth mode refuses execution but keeps health and the shell public
        run: |
          set -euo pipefail
          PORT=18081 CORE_HOST=0.0.0.0 \
            WEBER_WEB_ROOT="$PWD/dist/web" \
            WORKSPACE_ROOT="$(mktemp -d)" \
            GITHUB_CLIENT_ID=Iv1.test \
            WEBER_ALLOWED_LOGINS=someone \
            WEBER_SESSION_SECRET=a-sufficiently-long-session-secret \
            bun run src/server/main.ts > /tmp/auth.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 6

          B=http://127.0.0.1:18081
          fail() { echo "FAIL: $1"; cat /tmp/auth.log; exit 1; }

          code() { curl -s -o /dev/null -w '%{http_code}' -m 10 "$@"; }

          [ "$(code "$B/api/fs/list?path=")" = "401" ] || fail "file access not gated"
          echo "ok: file access gated"
          [ "$(code -X POST -H 'content-type: application/json' -d '{}' "$B/api/tools/run")" = "401" ] \
            || fail "command execution not gated"
          echo "ok: command execution gated"

          # These two must stay open or the release fails its healthcheck, or
          # the login page cannot load.
          [ "$(code "$B/api/health")" = "200" ] || fail "health must stay public"
          [ "$(code "$B/")" = "200" ] || fail "the SPA shell must stay public"
          echo "ok: health and the shell stay public"

  build-images:
    name: Build and smoke-test every image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the core image
        run: docker build -f compose/Dockerfile.core -t weber-core:ci .

      - name: Build the edge image
        run: docker build -f compose/Dockerfile.web -t weber-web:ci .

      - name: Build the single-image PaaS variant
        run: docker build -f deploy/paas/Dockerfile -t weber-paas:ci .

      # A successful build proves the layers are valid. It does NOT prove the
      # container starts, binds, or answers its healthcheck — and every one of
      # these images had never been built at all before this job existed.
      - name: Smoke-test the core image
        run: |
          set -euo pipefail
          docker run -d --name core \
            -e CORE_HOST=0.0.0.0 -e CORE_PORT=8787 \
            -e WORKSPACE_ROOT=/workspaces -e WEBER_SEED=1 \
            weber-core:ci
          fail() { echo "FAIL: $1"; docker logs core; exit 1; }

          for i in $(seq 1 30); do
            docker exec core wget -qO- http://127.0.0.1:8787/api/health >/dev/null 2>&1 && break
            sleep 1
          done

          docker exec core wget -qO- http://127.0.0.1:8787/api/health | grep -q '"status":"ok"' \
            || fail "core health check failed"
          echo "ok: core answers /api/health"

          # Confirms the seed ran and the workspace is writable as the
          # unprivileged user, which a permission mistake would break.
          docker exec core wget -qO- 'http://127.0.0.1:8787/api/fs/list?path=' | grep -q README.md \
            || fail "core did not seed its workspace"
          echo "ok: core seeded its workspace"

          docker exec core sh -c 'id -u' | grep -qv '^0$' || fail "core is running as root"
          echo "ok: core is not root"

      - name: Smoke-test the edge image unprivileged
        run: |
          set -euo pipefail
          # No core upstream, so the SPA must still be served: this asserts the
          # routing config parses and the shell is reachable.
          docker run -d --name web -p 18080:8080 weber-web:ci
          fail() { echo "FAIL: $1"; docker logs web; exit 1; }
          sleep 4

          # If nginx failed to write its pid or temp dirs as the nginx user it
          # exits immediately, and this is where that shows up.
          docker ps --filter name=web --filter status=running | grep -q web \
            || fail "edge container is not running (likely a permissions failure)"

          curl -sf -m 10 http://127.0.0.1:18080/healthz >/dev/null || fail "edge healthz failed"
          echo "ok: edge healthz responds"

          CT=$(curl -s -o /dev/null -w '%{content_type}' -m 10 http://127.0.0.1:18080/)
          case "$CT" in text/html*) echo "ok: edge serves the SPA as $CT" ;;
            *) fail "edge served $CT, expected text/html" ;; esac

          docker exec web sh -c 'id -u' | grep -qv '^0$' || fail "edge is running as root"
          echo "ok: edge is not root"

      - name: Smoke-test the PaaS image on the platform PORT
        run: |
          set -euo pipefail
          docker run -d --name paas -e PORT=9999 -p 19999:9999 weber-paas:ci
          fail() { echo "FAIL: $1"; docker logs paas; exit 1; }

          for i in $(seq 1 30); do
            curl -sf -m 5 http://127.0.0.1:19999/api/health >/dev/null 2>&1 && break
            sleep 1
          done

          curl -sf -m 10 http://127.0.0.1:19999/api/health >/dev/null || fail "PaaS image ignored PORT"
          echo "ok: PaaS image honours PORT"

          CT=$(curl -s -o /dev/null -w '%{content_type}' -m 10 http://127.0.0.1:19999/)
          case "$CT" in text/html*) echo "ok: PaaS image serves the SPA from the core" ;;
            *) fail "PaaS image served $CT, expected text/html" ;; esac

      - name: Container logs on failure
        if: failure()
        run: |
          for c in core web paas; do
            echo "=== $c ==="
            docker logs "$c" 2>&1 | tail -40 || true
          done

  e2e:
    name: Spawn-dependent tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      # These tests need a real child process, which a hosted runner allows.
      - name: Run spawn-dependent tests
        run: bun run test:e2e

  compose:
    name: Compose config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate podman-compose file
        run: |
          python3 -c "import yaml,sys; d=yaml.safe_load(open('podman-compose.yml')); \
            assert 'services' in d, 'no services'; \
            assert set(d['services']) >= {'web','core'}, d['services'].keys(); \
            assert 'ports' in d['services']['web'], 'edge must publish a port'; \
            assert 'ports' not in d['services']['core'], 'core must not be published'; \
            print('compose topology OK')"

      # `nginx -t` resolves upstream hostnames at config-test time, so the
      # compose service name must exist as a host for the check to be
      # meaningful outside the compose network.
      - name: Validate nginx config syntax
        run: |
          docker run --rm \
            --add-host core:127.0.0.1 \
            -v "$PWD/compose/nginx.conf:/etc/nginx/conf.d/weber.conf:ro" \
            nginx:1.27-alpine nginx -t

  chart:
    name: Helm chart renders and refuses unsafe config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Lint the chart
        run: helm lint chart

      # Defaults must render, or nobody can install the chart at all.
      - name: Render with default values
        run: helm template weber ./chart > /tmp/default.yaml

      - name: Assert nothing is publicly exposed by default
        run: |
          if grep -qE 'type: (NodePort|LoadBalancer)' /tmp/default.yaml; then
            echo "FAIL: a Service is exposed by default"; exit 1
          fi
          if grep -q 'kind: Ingress' /tmp/default.yaml; then
            echo "FAIL: an Ingress is created by default"; exit 1
          fi
          echo "ok: nothing exposed by default"

      # The safety property: exposing Weber without auth must FAIL, not warn.
      - name: Exposing without auth must be refused
        run: |
          if helm template weber ./chart --set ingress.enabled=true > /dev/null 2>&1; then
            echo "FAIL: the chart rendered an unauthenticated public deployment"; exit 1
          fi
          echo "ok: refused to render an unauthenticated public deployment"

      - name: An empty allow-list must be refused
        run: |
          if helm template weber ./chart \
               --set ingress.enabled=true --set auth.enabled=true \
               --set auth.githubClientId=Iv1.test --set auth.allowedLogins= \
               > /dev/null 2>&1; then
            echo "FAIL: rendered with an empty allow-list"; exit 1
          fi
          echo "ok: refused an empty allow-list"

      - name: A fully configured deployment must render
        run: |
          helm template weber ./chart \
            --set ingress.enabled=true \
            --set auth.enabled=true \
            --set auth.githubClientId=Iv1.test \
            --set auth.allowedLogins=someone \
            --set gitlab.enabled=true \
            --set dsh.enabled=true > /tmp/full.yaml
          echo "ok: full configuration renders"
          grep -c 'kind: Deployment' /tmp/full.yaml
