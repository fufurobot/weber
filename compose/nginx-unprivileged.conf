# Weber — main nginx configuration for an UNPRIVILEGED container.
#
# The stock nginx:alpine config writes its pid to /var/run and keeps its temp
# directories under /var/cache/nginx. Running as the `nginx` user, /var/run is
# not writable, so nginx exits immediately with a bare "permission denied".
#
# compose/nginx.conf is only a server-block fragment included from conf.d and
# cannot override any of this, which is why the whole main config is replaced.
#
# The routing itself lives in conf.d/weber.conf.

worker_processes auto;

# stderr, so the container runtime collects the log without a volume.
error_log /dev/stderr warn;
# /tmp is world-writable in the base image, so no chown is needed for the pid.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All temp paths under the directory the Dockerfile chowns to nginx.
    # client_body_temp_path is the one that matters at runtime: without it a
    # POST body fails, which breaks the API proxy in a way that looks like a
    # backend bug rather than a permissions problem.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    log_format main '$remote_addr - $request "$status" $body_bytes_sent '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # gzip keeps the 44 KiB bundle and its dependencies small over the wire.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
