# Weber — edge router.
#
# nginx is the only published surface (WEB_PORT). It serves the static SPA
# and reverse-proxies the API + terminal websocket to the Bun core service.

upstream weber_core {
    server core:8787;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name  _;

    # Static assets: long-lived, content-hashed by the build.
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the shell; it references hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Readiness/liveness for the edge itself.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Core API.
    location /api/ {
        proxy_pass         http://weber_core;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Terminal / notebook event stream: websocket upgrade.
    location /ws {
        proxy_pass         http://weber_core;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
